<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8" />
   <title>날씨 친구</title>

   <link rel="shortcut icon" href="/static/icons/WeatherMateHaveWord.ico">
   <meta name="viewport" content="width=device-width, initial-scale=1" />

   <script src="https://cdn.tailwindcss.com"></script>

   <style>
      /* 예보 컨테이너 가로 스크롤 가능하게 설정 */
      #forecast-container {
         overflow-x: auto !important;
         -webkit-overflow-scrolling: touch;
      }

      /* 스크롤바 디자인 */
      #forecast-container::-webkit-scrollbar {
         height: 8px;
         background: #282828;
         border-radius: 4px;
      }

      #forecast-container::-webkit-scrollbar-thumb {
         background: #888;
         border-radius: 4px;
      }

      /* 하루 예보를 담는 박스에만 적용 */
      #forecast-list>div {
         margin-top: 0.5rem;
         margin-bottom: 0.5rem;
         padding-top: 1rem;
         padding-bottom: 1rem;
         display: flex;
         flex-direction: column;
         justify-content: center;
         box-sizing: border-box;
         min-height: 150px;
         height: auto;
         overflow-y: visible;
      }

      /* 검색 버튼 스타일 */
      #search-btn {
         transition: background-color 0.3s ease, box-shadow 0.3s ease;
         box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5),
            0 2px 4px -1px rgba(37, 99, 235, 0.4);
      }

      #search-btn:hover {
         background: linear-gradient(90deg, #2563eb, #1e40af);
         box-shadow: 0 8px 12px -2px rgba(37, 99, 235, 0.6),
            0 4px 6px -2px rgba(30, 64, 175, 0.5);
      }

      /* 업로드 버튼 스타일 */
      #go-upload-btn {
         transition: background-color 0.3s ease, box-shadow 0.3s ease;
         box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.5),
            0 2px 4px -1px rgba(22, 163, 74, 0.4);
      }

      #go-upload-btn:hover {
         background: linear-gradient(90deg, #16a34a, #15803d);
         box-shadow: 0 8px 12px -2px rgba(22, 163, 74, 0.6),
            0 4px 6px -2px rgba(21, 128, 61, 0.5);
      }
   </style>
</head>

<body
   class="bg-gradient-to-tr from-blue-50 via-white to-blue-100 font-sans min-h-screen flex flex-col items-center p-6 text-gray-800">

   <img src="../static/icons/WeatherMateNoWord.ico" alt="날씨 친구 로고" class="w-48 h-35 mb-4 drop-shadow-lg" loading="lazy"
      decoding="async" />

   <h2 class="text-4xl font-extrabold mb-2 text-center text-blue-900 drop-shadow-md">날씨 친구</h2>

   <h3 class="text-lg mb-6 text-center text-blue-700 max-w-xl">지도에서 위치를 클릭하거나 주소를 입력하여<br />날씨 정보를 확인하세요!</h3>

   <div id="map"
      class="w-full max-w-5xl h-96 rounded-xl shadow-xl border-2 border-blue-500 transition-shadow hover:shadow-2xl"
      role="region" aria-label="날씨 지도"></div>

   <div id="accuracy-text" class="mt-2 text-sm text-blue-800 font-medium"></div>

   <div class="mt-6 max-w-5xl w-full flex gap-3">
      <input type="text" id="address-input" placeholder="주소를 입력하세요"
         class="flex-grow rounded-xl border-2 border-blue-400 px-5 py-3 font-bold text-blue-900 placeholder-blue-400 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-400 transition" />
      <button id="search-btn" type="button"
         class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-3 rounded-xl font-semibold shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300 transition">
         🔍 검색
      </button>
   </div>

   <div class="mt-6 max-w-5xl w-full flex justify-end items-center gap-2 text-blue-900">
      <button id="go-upload-btn" type="button"
         class="inline-flex items-center justify-center bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold px-5 py-3 rounded-xl shadow-lg focus:outline-none focus:ring-4 focus:ring-green-300 transition select-none">
         ⬆️ 이미지 업로드 페이지로 이동
      </button>
      <button id="recenter-btn" type="button"
         class="inline-flex items-center justify-center bg-gradient-to-r from-blue-400 to-blue-600 text-white font-semibold px-5 py-3 rounded-xl shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300 transition select-none">
         📍 현재 위치로 이동
      </button>
   </div>

   <div id="warning-message"
      class="bg-yellow-300 text-yellow-900 text-center py-2 text-sm font-semibold rounded-xl mt-6 max-w-5xl w-full select-none hidden">
      ⚠️ 북한이나 해외는 주소 정보가 부분적으로 영어가 표시될 수 있습니다.<br />
      다만, 날씨 정보는 정확하게 제공됩니다.
   </div>

   <section id="info-container"
      class="mt-8 max-w-5xl w-full bg-blue-200 rounded-3xl shadow-2xl p-8 flex flex-col md:flex-row md:items-center gap-8 text-blue-900 border border-blue-200">
      <div id="info" class="flex-1 text-lg leading-relaxed select-text text-center md:text-left">
         날씨 정보 없음
      </div>
      <img id="weather-img" src="" alt="날씨 이미지" class="w-40 h-40 rounded-xl object-cover self-center mx-auto md:mx-0"
         loading="lazy" decoding="async" />
   </section>

   <section id="forecast-container"
      class="mt-6 max-w-5xl w-full bg-blue-300 rounded-xl p-3 shadow-inner border border-blue-200 whitespace-nowrap overflow-x-auto">
      <div id="forecast-list" class="inline-flex gap-3"></div>
   </section>

   <script type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=037ece45122535d37366821e9fe46e2d&libraries=services"></script>

   <script>
      const weatherCache = new Map();
      let lastRequestedCoords = null;
      let isRequesting = false;
      let accuracyCircle = null;
      let map, marker;

      const geocoder = new kakao.maps.services.Geocoder();

      function showLoading() {
         document.getElementById("info").innerText = "현재 위치를 확인하고 있습니다...";
         document.getElementById("weather-img").src = "";
         document.getElementById("forecast-list").innerHTML = "";
         document.getElementById("accuracy-text").textContent = "";
         if (accuracyCircle) {
            accuracyCircle.setMap(null);
            accuracyCircle = null;
         }
      }

      function showError(msg) {
         document.getElementById("info").innerText = msg;
         document.getElementById("weather-img").src = "";
         document.getElementById("forecast-list").innerHTML = "";
         document.getElementById("accuracy-text").textContent = "";
         if (accuracyCircle) {
            accuracyCircle.setMap(null);
            accuracyCircle = null;
         }
      }

      async function fetchWeatherAndUpdate(lat, lon, marker, accuracy = null) {
         lat = parseFloat(lat.toFixed(10));
         lon = parseFloat(lon.toFixed(10));
         const coordKey = `${lat},${lon}`;
         if (lastRequestedCoords === coordKey && isRequesting) return;
         lastRequestedCoords = coordKey;

         if (weatherCache.has(coordKey)) {
            updateUIWithWeatherData(weatherCache.get(coordKey), marker, lat, lon, accuracy);
            return;
         }

         showLoading();
         isRequesting = true;

         try {
            const res = await fetch("/weather", {
               method: "POST",
               headers: { "Content-Type": "application/json" },
               body: JSON.stringify({ lat, lon }),
            });
            const data = await res.json();
            if (!res.ok || data.cod !== 200) {
               throw new Error(data.message || "날씨 정보를 불러오지 못했습니다.");
            }

            weatherCache.set(coordKey, data);
            updateUIWithWeatherData(data, marker, lat, lon, accuracy);
         } catch (err) {
            console.error("날씨 정보 요청 오류:", err);
            showError("서버 요청 중 오류가 발생했습니다.");
         } finally {
            isRequesting = false;
         }
      }

      function updateUIWithWeatherData(data, marker, lat, lon, accuracy = null) {
         const infoEl = document.getElementById("info");
         const imgEl = document.getElementById("weather-img");
         const forecastList = document.getElementById("forecast-list");
         const accuracyTextEl = document.getElementById("accuracy-text");

         const {
            korean_address: address,
            current_weather,
            forecast,
            user_weather_image: userImg
         } = data;

         infoEl.innerHTML = `
      <p class="text-2xl font-bold mb-2 select-text">
         📍 위치:
         <a href="https://map.kakao.com/link/map/${lat},${lon}" target="_blank" rel="noopener noreferrer" class="underline hover:text-green-700 transition">${address}</a>
      </p>
      <p class="mb-1">🌡️ 온도: <span class="font-extrabold">${current_weather.temp}°C</span> (체감: ${current_weather.feels_like}°C)</p>
      <p class="mb-1">⛅ 날씨: ${current_weather.description}</p>
      <p class="mb-1">💧 습도: <span class="font-extrabold">${current_weather.humidity}%</span></p>
   `;

         imgEl.src = userImg || `https://openweathermap.org/img/wn/${current_weather.icon}@4x.png`;
         imgEl.alt = current_weather.description;

         if (accuracy) {
            const radius = accuracy / 2;
            accuracyTextEl.innerHTML = `📏 예상 위치 반경: 약 ${Math.round(radius)}m<br>원 안에 있을 것으로 예상됩니다.`;
            accuracyTextEl.style.textAlign = 'center';
            if (accuracyCircle) accuracyCircle.setMap(null);
            accuracyCircle = new kakao.maps.Circle({
               center: new kakao.maps.LatLng(lat, lon),
               radius: radius,
               strokeWeight: 0,
               fillColor: 'rgba(30,144,255,0.2)',
               fillOpacity: 1,
               map: map
            });
         } else {
            accuracyTextEl.textContent = "";
            if (accuracyCircle) {
               accuracyCircle.setMap(null);
               accuracyCircle = null;
            }
         }

         forecastList.innerHTML = "";
         const grouped = {};
         forecast.forEach(item => {
            if (!grouped[item.date]) grouped[item.date] = [];
            grouped[item.date].push(item);
         });

         Object.keys(grouped).slice(0, 4).forEach(date => {
            const [y, m, d] = date.split("-");
            const dayLabel = `${parseInt(m)}월 ${parseInt(d)}일`;
            const dayContainer = document.createElement("div");
            dayContainer.className = "bg-blue-200 rounded-xl p-4 shadow-lg mb-4 w-full text-blue-900 flex flex-col justify-between";
            const header = document.createElement("h4");
            header.className = "font-bold text-lg mb-4";
            header.textContent = dayLabel;
            const timeContainer = document.createElement("div");
            timeContainer.className = "inline-flex gap-3 overflow-x-auto whitespace-nowrap pt-1";
            grouped[date].forEach(item => {
               const card = document.createElement("div");
               card.className = "bg-blue-300 rounded-xl p-3 text-center flex-shrink-0 w-24 text-blue-900 border border-gray-300";
               card.innerHTML = `
            <p class="font-semibold text-sm mb-1">${item.time}</p>
            <img src="https://openweathermap.org/img/wn/${item.icon}@2x.png" class="mx-auto mb-1" alt="${item.description}" title="${item.description}" style="width:48px; height:48px;" loading="lazy" />
            <p class="text-sm">🌡 ${item.temp ?? '-'}°C</p>
            <p class="text-sm">💧 ${item.humidity ?? '-'}%</p>
            <p class="text-xs capitalize truncate" title="${item.description}">${item.description}</p>
         `;
               timeContainer.appendChild(card);
            });
            dayContainer.appendChild(header);
            dayContainer.appendChild(timeContainer);
            forecastList.appendChild(dayContainer);
         });
      }

      async function fetchGoogleLocation() {
         try {
            const response = await fetch('/geolocate', {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
            });
            const data = await response.json();
            if (data.location) {
               return {
                  latitude: data.location.lat,
                  longitude: data.location.lng,
                  accuracy: data.accuracy || null,
               };
            }
            return null;
         } catch {
            return null;
         }
      }

      function searchAddress(addr) {
         geocoder.addressSearch(addr, function (result, status) {
            if (status === kakao.maps.services.Status.OK) {
               const lat = parseFloat(result[0].y);
               const lon = parseFloat(result[0].x);
               const pos = new kakao.maps.LatLng(lat, lon);

               map.setCenter(pos);
               map.setLevel(5);
               marker.setPosition(pos);

               fetchWeatherAndUpdate(lat, lon, marker);
            } else {
               alert("주소를 찾을 수 없습니다.");
            }
         });
      }

      async function initMap() {
         const defaultLat = 37.4940906854463;
         const defaultLng = 126.917031672483;
         const mapContainer = document.getElementById('map');

         map = new kakao.maps.Map(mapContainer, {
            center: new kakao.maps.LatLng(defaultLat, defaultLng),
            level: 7,
         });

         marker = new kakao.maps.Marker({
            position: new kakao.maps.LatLng(defaultLat, defaultLng),
            map: map
         });

         const googleLocation = await fetchGoogleLocation();
         if (googleLocation) {
            const { latitude, longitude, accuracy } = googleLocation;
            const pos = new kakao.maps.LatLng(latitude, longitude);
            map.setCenter(pos);
            map.setLevel(5);
            marker.setPosition(pos);
            fetchWeatherAndUpdate(latitude, longitude, marker, accuracy);
         } else if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
               (position) => {
                  const lat = position.coords.latitude;
                  const lon = position.coords.longitude;
                  const acc = position.coords.accuracy;
                  const pos = new kakao.maps.LatLng(lat, lon);
                  map.setCenter(pos);
                  map.setLevel(5);
                  marker.setPosition(pos);
                  fetchWeatherAndUpdate(lat, lon, marker, acc);
               },
               () => {
                  fetchWeatherAndUpdate(defaultLat, defaultLng, marker);
               },
               { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
         } else {
            fetchWeatherAndUpdate(defaultLat, defaultLng, marker);
         }

         kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
            const lat = mouseEvent.latLng.getLat();
            const lon = mouseEvent.latLng.getLng();
            marker.setPosition(mouseEvent.latLng);
            map.setCenter(mouseEvent.latLng);
            fetchWeatherAndUpdate(lat, lon, marker);
         });

         // 검색 버튼 이벤트
         document.getElementById("search-btn").addEventListener("click", () => {
            const addr = document.getElementById("address-input").value.trim();
            if (!addr) {
               alert("주소를 입력하세요.");
               return;
            }
            searchAddress(addr);
         });

         // 엔터키 이벤트 (주소 입력창)
         document.getElementById("address-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.keyCode === 13) {
               e.preventDefault();
               document.getElementById("search-btn").click();
            }
         });
      }

      document.addEventListener("DOMContentLoaded", initMap);

   </script>

</body>

</html>
