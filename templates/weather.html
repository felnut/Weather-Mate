<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8" />
   <title>날씨 친구</title>

   <!-- 파비콘 설정 -->
   <link rel="shortcut icon" href="{{ url_for('static', filename='icons/WeatherMateHaveWord.ico') }}">
   <meta name="viewport" content="width=device-width, initial-scale=1" />

   <!-- Tailwind CSS 불러오기 -->
   <script src="https://cdn.tailwindcss.com"></script>

   <style>
      /* 예보 컨테이너 가로 스크롤 가능하게 설정 */
      #forecast-container {
         overflow-x: auto !important;
         -webkit-overflow-scrolling: touch;
      }

      /* 스크롤바 디자인 */
      #forecast-container::-webkit-scrollbar {
         height: 8px;
         background: #282828;
         border-radius: 4px;
      }

      #forecast-container::-webkit-scrollbar-thumb {
         background: #888;
         border-radius: 4px;
      }

      /* 하루 예보를 담는 박스에만 적용 */
      #forecast-list>div {
         margin-top: 0.5rem;
         margin-bottom: 0.5rem;
         padding-top: 1rem;
         padding-bottom: 1rem;
         display: flex;
         flex-direction: column;
         justify-content: center;
         box-sizing: border-box;
         min-height: 150px;
         height: auto;
         overflow-y: visible;
      }

      /* 검색 버튼 스타일 */
      #search-btn {
         transition: background-color 0.3s ease, box-shadow 0.3s ease;
         box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5),
            0 2px 4px -1px rgba(37, 99, 235, 0.4);
      }

      #search-btn:hover {
         background: linear-gradient(90deg, #2563eb, #1e40af);
         box-shadow: 0 8px 12px -2px rgba(37, 99, 235, 0.6),
            0 4px 6px -2px rgba(30, 64, 175, 0.5);
      }

      /* 업로드 버튼 스타일 */
      #go-upload-btn {
         transition: background-color 0.3s ease, box-shadow 0.3s ease;
         box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.5),
            0 2px 4px -1px rgba(22, 163, 74, 0.4);
      }

      #go-upload-btn:hover {
         background: linear-gradient(90deg, #16a34a, #15803d);
         box-shadow: 0 8px 12px -2px rgba(22, 163, 74, 0.6),
            0 4px 6px -2px rgba(21, 128, 61, 0.5);
      }
   </style>
</head>

<body
   class="bg-gradient-to-tr from-blue-50 via-white to-blue-100 font-sans min-h-screen flex flex-col items-center p-6 text-gray-800">

   <!-- 앱 로고 -->
   <img src="../static/icons/WeatherMateNoWord.ico" alt="날씨 친구 로고" class="w-48 h-35 mb-4 drop-shadow-lg" loading="lazy"
      decoding="async" />

   <!-- 앱 제목 -->
   <h2 class="text-4xl font-extrabold mb-2 text-center text-blue-900 drop-shadow-md">날씨 친구</h2>

   <!-- 앱 설명 -->
   <h3 class="text-lg mb-6 text-center text-blue-700 max-w-xl">지도에서 위치를 클릭하거나 주소를 입력하여<br />날씨 정보를 확인하세요!</h3>

   <!-- 구글 지도 표시 영역 -->
   <div id="map"
      class="w-full max-w-5xl h-96 rounded-xl shadow-xl border-2 border-blue-500 transition-shadow hover:shadow-2xl"
      role="region" aria-label="날씨 지도"></div>

   <!-- 주소 입력창 + 검색 버튼 -->
   <div class="mt-6 max-w-5xl w-full flex gap-3">
      <input type="text" id="address-input" placeholder="주소를 입력하세요"
         class="flex-grow rounded-xl border-2 border-blue-400 px-5 py-3 font-bold text-blue-900 placeholder-blue-400 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-400 transition" />
      <button id="search-btn" type="button"
         class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-3 rounded-xl font-semibold shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300 transition">
         🔍 검색
      </button>
   </div>

   <!-- 업로드 페이지로 이동 버튼 -->
   <div class="mt-6 max-w-5xl w-full flex justify-end items-center gap-2 text-blue-900">
      <button id="go-upload-btn" type="button"
         class="inline-flex items-center justify-center bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold px-5 py-3 rounded-xl shadow-lg focus:outline-none focus:ring-4 focus:ring-green-300 transition select-none">
         ⬆️ 이미지 업로드 페이지로 이동
      </button>
   </div>

   <!-- 경고 메시지 (한국 외 지역 선택 시 표시됨) -->
   <div id="warning-message"
      class="bg-yellow-300 text-yellow-900 text-center py-2 text-sm font-semibold rounded-xl mt-6 max-w-5xl w-full select-none hidden">
      ⚠️ 북한이나 해외는 주소 정보가 부분적으로 영어가 표시될 수 있습니다.<br />
      다만, 날씨 정보는 정확하게 제공됩니다.
   </div>

   <!-- 현재 날씨 정보 및 이미지 -->
   <section id="info-container"
      class="mt-8 max-w-5xl w-full bg-blue-200 rounded-3xl shadow-2xl p-8 flex flex-col md:flex-row md:items-center gap-8 text-blue-900 border border-blue-200">
      <div id="info" class="flex-1 text-lg leading-relaxed select-text text-center md:text-left">
         날씨 정보 없음
      </div>
      <img id="weather-img" src="" alt="날씨 이미지" class="w-40 h-40 rounded-xl object-cover self-center mx-auto md:mx-0"
         loading="lazy" decoding="async" />
   </section>

   <!-- 날씨 예보 리스트 -->
   <section id="forecast-container"
      class="mt-6 max-w-5xl w-full bg-blue-300 rounded-xl p-3 shadow-inner border border-blue-200 whitespace-nowrap overflow-x-auto">
      <div id="forecast-list" class="inline-flex gap-3"></div>
   </section>

   <!-- 주요 자바스크립트 로직 시작 -->
   <script>
      // 날씨 요청 캐시 및 상태 변수
      const weatherCache = new Map();
      let lastRequestedCoords = null;
      let isRequesting = false;

      // 로딩 표시 함수
      function showLoading() {
         document.getElementById("info").innerText = "날씨 정보를 불러오는 중...";
         document.getElementById("weather-img").src = "";
         document.getElementById("forecast-list").innerHTML = "";
      }

      // API로 날씨 정보 요청 후 UI 갱신
      async function fetchWeatherAndUpdate(lat, lon, marker) {
         const coordKey = `${lat.toFixed(5)},${lon.toFixed(5)}`;
         if (lastRequestedCoords === coordKey && isRequesting) return;
         lastRequestedCoords = coordKey;

         if (weatherCache.has(coordKey)) {
            updateUIWithWeatherData(weatherCache.get(coordKey), marker, lat, lon);
            return;
         }

         marker.setPosition({ lat, lng: lon });
         showLoading();
         isRequesting = true;

         try {
            const response = await fetch("/weather", {
               method: "POST",
               headers: { "Content-Type": "application/json" },
               body: JSON.stringify({ lat, lon }),
            });

            if (!response.ok) throw new Error(`서버 응답 오류: ${response.status}`);

            const data = await response.json();
            if (data.cod !== 200) {
               showError("날씨 정보를 불러오지 못했습니다.");
               return;
            }

            weatherCache.set(coordKey, data);
            updateUIWithWeatherData(data, marker, lat, lon);
         } catch (err) {
            showError("서버 요청 중 오류가 발생했습니다.");
         } finally {
            isRequesting = false;
         }
      }

      // 에러 메시지 표시
      function showError(msg) {
         document.getElementById("info").innerText = msg;
         document.getElementById("weather-img").src = "";
         document.getElementById("forecast-list").innerHTML = "";
      }

      // 날씨 정보로 UI 업데이트
      function updateUIWithWeatherData(data, marker, lat, lon) {
         marker.setPosition({ lat, lng: lon });

         const { korean_address: address, current_weather, forecast, user_weather_image: userImg, country } = data;

         // regionName을 주소 전체로 설정 (읍, 면, 동, 리 포함)
         const regionName = address;

         // 한국 국가명 키워드 배열
         const koreaNames = ["대한민국", "한국", "Korea", "Republic of Korea"];

         const isKorea = koreaNames.some(name => country && country.includes(name));

         // 지도 링크 URL 생성
         let mapUrl;
         if (isKorea) {
            // 한국인 경우 네이버 지도 (주소 전체)
            mapUrl = `https://map.naver.com/v5/search/${encodeURIComponent(regionName)}`;
         } else {
            // 해외 또는 북한일 경우 구글 지도 (위도,경도)
            mapUrl = `https://www.google.com/maps/search/?api=1&query=${lat.toFixed(6)},${lon.toFixed(6)}`;
         }

         // 경고 메시지 토글
         const warningEl = document.getElementById("warning-message");
         if (!isKorea) {
            warningEl.classList.remove("hidden");
         } else {
            warningEl.classList.add("hidden");
         }

         // info 영역 HTML 세팅
         document.getElementById("info").innerHTML = `
            <p class="text-2xl font-bold mb-2 select-text">
               📍 위치:
               <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="underline hover:text-green-700 transition">
                  ${address}
               </a>
            </p>
            <p class="mb-1">🌡️ 온도: <span class="font-extrabold">${current_weather.temp}°C</span> (체감: ${current_weather.feels_like}°C)</p>
            <p class="mb-1">⛅ 날씨: ${current_weather.description}</p>
            <p class="mb-1">💧 습도: <span class="font-extrabold">${current_weather.humidity}%</span></p>
         `;

         const imgEl = document.getElementById("weather-img");
         imgEl.src = userImg || `https://openweathermap.org/img/wn/${current_weather.icon}@4x.png`;
         imgEl.alt = current_weather.description;

         // 예보 표시 코드
         const forecastList = document.getElementById("forecast-list");
         forecastList.innerHTML = "";

         const grouped = {};
         forecast.forEach(item => {
            const date = item.date;
            if (!grouped[date]) grouped[date] = [];
            grouped[date].push(item);
         });

         const today = new Date();
         today.setHours(0, 0, 0, 0);

         const dates = Object.keys(grouped)
            .sort((a, b) => new Date(a) - new Date(b))
            .filter(d => new Date(d) >= today)
            .slice(0, 4);

         dates.forEach(date => {
            const [y, m, d] = date.split('-');
            const dayLabel = `${parseInt(m)}월 ${parseInt(d)}일`;

            const dayContainer = document.createElement("div");
            dayContainer.className = "bg-blue-200 rounded-xl p-4 shadow-lg mb-4 w-full text-blue-900 flex flex-col justify-between";
            dayContainer.style.minHeight = "220px";

            const header = document.createElement("h4");
            header.className = "font-bold text-lg mb-4";
            header.textContent = dayLabel;
            dayContainer.appendChild(header);

            const timeContainer = document.createElement("div");
            timeContainer.className = "inline-flex gap-3 overflow-x-auto whitespace-nowrap pt-1";

            grouped[date].forEach(item => {
               const card = document.createElement("div");
               card.className = "bg-blue-300 rounded-xl p-3 text-center flex-shrink-0 w-24 text-blue-900 border border-gray-300";

               const icon = item.icon || '01d';
               const desc = item.description || '정보 없음';

               const imgSrc = `https://openweathermap.org/img/wn/${icon}@2x.png`;

               card.innerHTML = `
            <p class="font-semibold text-sm mb-1">${item.time}</p>
            <img src="${imgSrc}"
               class="mx-auto mb-1" alt="${desc}" title="${desc}"
               style="width:48px; height:48px;" loading="lazy" decoding="async" />
            <p class="text-sm">🌡 ${item.temp ?? '-'}°C</p>
            <p class="text-sm">💧 ${item.humidity ?? '-'}%</p>
            <p class="text-xs capitalize truncate" title="${desc}">${desc}</p>
         `;
               timeContainer.appendChild(card);
            });

            dayContainer.appendChild(timeContainer);
            forecastList.appendChild(dayContainer);
         });
      }

      // 지도 스타일 (POI 등 제거)
      const simpleMapStyle = [
         { featureType: "poi", stylers: [{ visibility: "off" }] },
         { featureType: "transit", stylers: [{ visibility: "off" }] },
         { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
         { featureType: "administrative", elementType: "labels.text.fill", stylers: [{ color: "#444444" }] }
      ];

      // 현재 위치 탐색 및 날씨 요청
      function fetchCurrentLocationAndWeather(marker, map) {
         if (!navigator.geolocation) {
            alert("현재 위치를 사용할 수 없습니다.");
            return;
         }
         navigator.geolocation.getCurrentPosition(
            (pos) => {
               const lat = pos.coords.latitude;
               const lon = pos.coords.longitude;
               map.setCenter({ lat, lng: lon });
               map.setZoom(14);
               marker.setPosition({ lat, lng: lon });
               fetchWeatherAndUpdate(lat, lon, marker);
            },
            (err) => {
               alert("현재 위치를 불러올 수 없습니다.");
            },
            { enableHighAccuracy: false, timeout: 3000, maximumAge: 1000 }
         );
      }

      // 지도 초기화 및 이벤트 설정
      function initMap() {
         const defaultLat = 37.4940906854463;
         const defaultLng = 126.917031672483;

         const geocoder = new google.maps.Geocoder();
         const map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: defaultLat, lng: defaultLng },
            zoom: 10,
            gestureHandling: "greedy",
            styles: simpleMapStyle,
            disableDefaultUI: true,
            zoomControl: false,
            mapTypeControl: true,
            streetViewControl: false,
            fullscreenControl: true
         });

         const marker = new google.maps.Marker({ map, position: { lat: defaultLat, lng: defaultLng } });

         fetchWeatherAndUpdate(defaultLat, defaultLng, marker);
         fetchCurrentLocationAndWeather(marker, map);

         map.addListener("click", (event) => {
            fetchWeatherAndUpdate(event.latLng.lat(), event.latLng.lng(), marker);
         });

         const addressInput = document.getElementById('address-input');
         let searchDebounceTimer = null;

         document.getElementById("search-btn").addEventListener("click", () => {
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
               const addr = addressInput.value.trim();
               if (!addr) return alert('주소를 입력하세요.');
               geocoder.geocode({ address: addr }, (results, status) => {
                  if (status === 'OK' && results[0]) {
                     const location = results[0].geometry.location;
                     map.setCenter(location);
                     map.setZoom(14);
                     marker.setPosition(location);
                     fetchWeatherAndUpdate(location.lat(), location.lng(), marker);
                  } else {
                     alert('주소를 찾을 수 없습니다.');
                  }
               });
            }, 300);
         });

         addressInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
               event.preventDefault();
               document.getElementById('search-btn').click();
            }
         });

         document.getElementById("go-upload-btn").addEventListener("click", () => {
            window.location.href = "/upload";
         });
      }
   </script>

   <!-- 구글 지도 API 키 삽입 -->
   <script async defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBngLYp-oC51BCoXTy1PhUaj9Hm239t_98&callback=initMap">
      </script>

</body>

</html>
