<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
   <title>날씨 이미지 업로드</title>
   <link rel="shortcut icon" href="{{ url_for('static', filename='icons/WeatherMateHaveWord.ico') }}">
   <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
   <script src="https://cdn.tailwindcss.com"></script>
   <style>
      /* 기본 폰트 및 배경 그라데이션 설정 */
      body {
         font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
            Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
         background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      }

      /* 숨김 처리한 파일 입력 필드 스타일 제거 */
      input[type="file"] {
         display: none;
      }

      /* 파일 선택 라벨 스타일 (버튼처럼 보이게) */
      label[for="image-input"] {
         cursor: pointer;
         display: inline-flex;
         align-items: center;
         justify-content: center;
         padding: 0.75rem 1.25rem;
         background: linear-gradient(90deg, #3b82f6, #2563eb);
         color: white;
         border-radius: 0.5rem;
         font-weight: 600;
         box-shadow: 0 6px 12px rgb(59 130 246 / 0.5);
         user-select: none;
         transition: background-color 0.3s ease, box-shadow 0.3s ease;
         gap: 0.5rem;
      }

      /* 파일 선택 라벨 호버 및 포커스 스타일 */
      label[for="image-input"]:hover,
      label[for="image-input"]:focus-visible {
         background: linear-gradient(90deg, #2563eb, #1e40af);
         box-shadow: 0 8px 16px rgb(37 99 235 / 0.6);
         outline: none;
      }

      /* 미리보기 이미지 스타일, 페이드인 효과 */
      #preview-image {
         opacity: 0;
         transition: opacity 0.2s ease-in-out;
         max-width: 100%;
         height: auto;
         border-radius: 0.5rem;
         border: 1px solid #d1d5db;
         box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
         object-fit: contain;
      }

      /* 미리보기 이미지가 보일 때 opacity 1로 변경 */
      #preview-image.visible {
         opacity: 1;
      }

      /* 파일명 말줄임표 처리 */
      #file-name {
         max-width: 12rem;
         overflow: hidden;
         white-space: nowrap;
         text-overflow: ellipsis;
         color: #6b7280;
         /* tailwind text-gray-500 */
         font-style: italic;
         user-select: text;
      }

      /* 버튼별 그림자 및 호버 효과 */
      .btn-blue-shadow {
         box-shadow:
            0 4px 6px -1px rgba(59, 130, 246, 0.5),
            0 2px 4px -1px rgba(37, 99, 235, 0.4);
         transition: box-shadow 0.3s ease;
      }

      .btn-blue-shadow:hover {
         box-shadow:
            0 8px 12px -2px rgba(37, 99, 235, 0.6),
            0 4px 6px -2px rgba(30, 64, 175, 0.5);
      }

      .btn-green-shadow {
         box-shadow:
            0 4px 6px -1px rgba(34, 197, 94, 0.5),
            0 2px 4px -1px rgba(22, 163, 74, 0.4);
         transition: box-shadow 0.3s ease;
      }

      .btn-green-shadow:hover {
         box-shadow:
            0 8px 12px -2px rgba(22, 163, 74, 0.6),
            0 4px 6px -2px rgba(21, 128, 61, 0.5);
      }

      .btn-red-shadow {
         box-shadow:
            0 4px 6px -1px rgba(239, 68, 68, 0.5),
            0 2px 4px -1px rgba(220, 38, 38, 0.4);
         transition: box-shadow 0.3s ease;
      }

      .btn-red-shadow:hover {
         box-shadow:
            0 8px 12px -2px rgba(220, 38, 38, 0.6),
            0 4px 6px -2px rgba(185, 28, 28, 0.5);
      }

      #upload-message {
         max-width: 31rem;
         /* 약 448px */
         padding: 1.5rem 2rem;
         /* 위아래 24px, 좌우 32px */
         font-size: 1.2rem;
         /* 조금 더 크면서 적당한 글씨 */
         border-radius: 0.75rem;
         /* 둥근 모서리 약간 줄임 */
         line-height: 1.4;
      }
   </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
   <!-- ✅ 최상단 고정 메시지 영역 -->
   <!-- 상단 알림 메시지 (showMessage에서 사용하는 것) -->
   <div id="top-message"
      class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-lg text-center text-lg font-semibold
         bg-gray-100 text-gray-800 border border-gray-300 opacity-0 pointer-events-none transition-opacity duration-500" role="alert"
      aria-live="polite"></div>

   <!-- 모달 배경 오버레이 -->
   <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-30 backdrop-blur-sm hidden z-40"></div>

   <!-- 초기화 메시지 박스 (모달) -->
   <div id="upload-message"
      class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 px-6 py-4 rounded-xl shadow-lg text-center text-base font-semibold bg-yellow-100 text-yellow-800 border border-yellow-300 hidden">
   </div>

   <!-- 메인 컨테이너: 배경 반투명, 블러 효과, 그림자 적용 -->
   <div
      class="w-full max-w-xl bg-white/90 backdrop-blur-sm rounded-3xl shadow-[0_20px_40px_rgba(0,0,0,0.1)] p-6 sm:p-8 flex flex-col gap-6">

      <!-- 페이지 제목 -->
      <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 text-center select-none">☁️ 날씨별 이미지 업로드</h2>

      <!-- 업로드 폼 -->
      <form id="upload-form" class="flex flex-col gap-5" novalidate>
         <!-- 1. 날씨 선택 셀렉트 박스 -->
         <div>
            <label for="weather-select" class="block mb-2 font-semibold text-gray-700">날씨 선택:</label>
            <!-- 날씨 선택 필수, 초기값 없음 -->
            <select id="weather-select" required
               class="w-full rounded-lg border border-gray-300 px-4 py-3 shadow-sm placeholder-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 transition">
               <option value="" disabled selected>-- 날씨를 선택하세요 --</option>
               <option value="clear">맑음 (clear)</option>
               <option value="clouds">흐림 (clouds)</option>
               <option value="rain">비 (rain)</option>
               <option value="snow">눈 (snow)</option>
               <option value="thunderstorm">천둥번개 (thunderstorm)</option>
               <option value="fog">안개 (fog)</option>
            </select>
         </div>

         <!-- 2. 파일 선택 및 URL 입력 그룹 (반응형 레이아웃) -->
         <div class="flex flex-col gap-2 w-full sm:w-auto">
            <div class="flex items-center gap-3">
               <!-- 2-1. 파일 input 숨김 -->
               <input type="file" id="image-input" accept=".png,.jpg,.jpeg,.gif,.svg,.webp" class="hidden" />

               <!-- 파일 선택 라벨 (버튼처럼 동작) -->
               <label for="image-input" aria-label="이미지 파일 선택" tabindex="0" role="button" title="파일 선택하기"
                  class="inline-flex items-center justify-center cursor-pointer whitespace-nowrap rounded-lg bg-blue-600 px-4 py-3 text-white font-semibold shadow hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-400 transition select-none">
                  📁 파일 선택하기
               </label>

               <!-- 선택한 파일 이름 표시 -->
               <span id="file-name" class="text-gray-500 italic select-text break-words truncate max-w-[12rem]"></span>
            </div>

            <!-- 2-2. 이미지 URL 입력 -->
            <div class="mt-2">
               <label for="image-url-input" class="block mb-1 font-semibold text-gray-700">이미지 URL 입력:</label>
               <input type="url" id="image-url-input" placeholder="https://example.com/image.png" autocomplete="off"
                  class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-800 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 transition" />
            </div>
         </div>

         <!-- 3. 버튼 그룹: 반응형 세로→가로 전환, 충분한 간격과 큰 터치 영역 -->
         <div class="flex flex-col sm:flex-row gap-4">
            <!-- 미리보기 버튼 -->
            <button type="button" id="preview-btn" class="flex-1 inline-flex items-center justify-center cursor-pointer rounded-lg bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-3 text-white font-semibold btn-blue-shadow
         focus:outline-none focus:ring-4 focus:ring-blue-400 transition select-none">
               🔍 미리보기
            </button>

            <!-- 업로드 제출 버튼 -->
            <button type="submit" class="flex-1 inline-flex items-center justify-center cursor-pointer rounded-lg bg-gradient-to-r from-green-600 to-green-700 px-4 py-3 text-white font-semibold btn-green-shadow
         focus:outline-none focus:ring-4 focus:ring-green-400 transition select-none">
               ⬆️ 업로드
            </button>

            <!-- 초기화 버튼 -->
            <button type="button" id="reset-btn" class="flex-1 inline-flex items-center justify-center cursor-pointer rounded-lg bg-gradient-to-r from-red-600 to-red-700 px-4 py-3 text-white font-semibold btn-red-shadow
         focus:outline-none focus:ring-4 focus:ring-red-400 transition select-none">
               🔄 초기화
            </button>
         </div>
      </form>

      <!-- 5. 이미지 미리보기 영역 (초기에는 숨김) -->
      <div id="preview-container"
         class="mt-4 rounded-xl border border-gray-300 shadow-lg overflow-hidden hidden bg-white p-4 flex flex-col items-center">
         <p class="text-gray-700 mb-3 px-4 pt-2 select-text font-semibold">🔍 미리보기:</p>
         <img id="preview-image" src="#" alt="미리보기 이미지" loading="lazy" decoding="async" />
      </div>

      <!-- 6. 날씨 정보 페이지로 이동 버튼 -->
      <div class="mt-8 text-right flex items-center justify-end gap-2 select-none">
         <button id="go-weather-btn" class="flex-1 inline-flex items-center justify-center rounded-lg
            bg-gradient-to-r from-blue-600 to-blue-700
            text-white font-semibold px-4 py-3
            btn-blue-shadow
            hover:from-blue-700 hover:to-blue-800 hover:shadow-xl
            focus:outline-none focus:ring-4 focus:ring-blue-400
            transition select-none" type="button">
            ⛅ 날씨 정보 페이지로 이동
         </button>
      </div>
   </div>

   <script>
      document.addEventListener("DOMContentLoaded", () => {
         const uploadForm = document.getElementById("upload-form");
         const previewBtn = document.getElementById("preview-btn");
         const previewContainer = document.getElementById("preview-container");
         const previewImage = document.getElementById("preview-image");
         const uploadMessage = document.getElementById("upload-message");
         const weatherSelect = document.getElementById("weather-select");
         const imageInput = document.getElementById("image-input");
         const imageUrlInput = document.getElementById("image-url-input");
         const resetBtn = document.getElementById("reset-btn");
         const goWeatherBtn = document.getElementById("go-weather-btn");
         const fileNameSpan = document.getElementById("file-name");
         const fileLabel = document.querySelector("label[for='image-input']");
         const topMessage = document.getElementById("top-message");

         let uploadedWeather = null;
         let uploadedImageUrl = null;
         let isUploading = false;
         let resetConfirmPending = false;
         let messageTimeout = null;

         const validExtensions = /\.(png|jpg|jpeg|gif|svg|webp)$/i;

         function isValidImageUrl(url) {
            try {
               const cleanUrl = url.split("?")[0];
               return validExtensions.test(cleanUrl);
            } catch {
               return false;
            }
         }

         function isValidFileExtension(filename) {
            return validExtensions.test(filename);
         }

         function showMessage(text, type = 'info') {
            clearTimeout(messageTimeout);

            topMessage.textContent = text;

            const colorClasses = {
               success: 'bg-green-100 text-green-800 border border-green-300',
               error: 'bg-red-100 text-red-800 border border-red-300',
               warn: 'bg-yellow-100 text-yellow-800 border border-yellow-300',
               info: 'bg-gray-100 text-gray-800 border border-gray-300',
            };

            // 클래스 초기화 + 기본 클래스 세팅
            topMessage.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-lg text-center text-lg font-semibold transition-opacity duration-500 opacity-100 pointer-events-auto';

            // 색깔 클래스 적용
            topMessage.classList.add(...(colorClasses[type] || colorClasses['info']).split(" "));

            // 보여주기
            topMessage.style.opacity = '1';
            topMessage.style.pointerEvents = 'auto';

            messageTimeout = setTimeout(() => {
               // 페이드 아웃
               topMessage.style.opacity = '0';
               topMessage.style.pointerEvents = 'none';
            }, 1100);
         }

         function clearMessage() {
            clearTimeout(messageTimeout);
            topMessage.style.opacity = '0';
            topMessage.style.pointerEvents = 'none';
            topMessage.textContent = '';
         }

         function clearMessage() {
            clearTimeout(messageTimeout);
            uploadMessage.textContent = '';
            uploadMessage.classList.add('hidden');
            uploadMessage.removeAttribute('role');
            uploadMessage.removeAttribute('aria-live');
         }

         fileLabel.addEventListener("click", (e) => {
            if (!weatherSelect.value) {
               e.preventDefault();
               showMessage("⚠️ 먼저 날씨를 선택해주세요.", "warn");
            } else {
               clearMessage();
            }
         });

         weatherSelect.addEventListener("change", () => {
            clearMessage();
            previewContainer.classList.add("hidden");
            imageInput.value = "";
            imageUrlInput.value = "";
            fileNameSpan.textContent = "";

            const selected = weatherSelect.value;
            if (!selected) {
               uploadedWeather = null;
               uploadedImageUrl = null;
               return;
            }

            if (uploadedWeather === selected && uploadedImageUrl) {
               showMessage("✅ 이미 업로드 하셨습니다.", "success");
            }
         });

         imageInput.addEventListener("change", () => {
            if (imageInput.files.length > 0) {
               fileNameSpan.textContent = imageInput.files[0].name;
               imageUrlInput.value = "";
               clearMessage();
               previewContainer.classList.add("hidden");
            } else {
               fileNameSpan.textContent = "";
            }
         });

         previewBtn.addEventListener("click", () => {
            const file = imageInput.files[0];
            const url = imageUrlInput.value.trim();

            if (file) {
               if (!isValidFileExtension(file.name)) {
                  showMessage("가능한 확장자는 png, jpg, jpeg, gif, svg, webp 입니다.", "error");
                  return;
               }
               const reader = new FileReader();
               reader.onload = e => {
                  previewImage.src = e.target.result;
                  previewImage.classList.add("visible");
                  previewContainer.classList.remove("hidden");
               };
               reader.readAsDataURL(file);
               return;
            }

            if (url) {
               if (!isValidImageUrl(url)) {
                  showMessage("지원되는 이미지 URL이 아닙니다.", "error");
                  return;
               }
               previewImage.src = url;
               previewImage.classList.add("visible");
               previewContainer.classList.remove("hidden");
               return;
            }

            if (uploadedImageUrl) {
               previewImage.src = uploadedImageUrl;
               previewImage.classList.add("visible");
               previewContainer.classList.remove("hidden");
               return;
            }

            showMessage("미리볼 이미지가 없습니다.", "warn");
         });

         uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (isUploading) return;

            isUploading = true;
            const submitBtn = uploadForm.querySelector("button[type='submit']");
            submitBtn.disabled = true;
            submitBtn.textContent = "⬆️ 업로드 중...";

            try {
               const weather = weatherSelect.value?.trim();
               const file = imageInput.files[0];
               const url = imageUrlInput.value.trim();

               if (!weather) {
                  showMessage("항목을 선택해주세요.", "warn");
                  return;
               }

               if (!file && !url) {
                  showMessage("이미지 파일 또는 URL을 입력해 주세요.", "warn");
                  return;
               }

               if (file && !isValidFileExtension(file.name)) {
                  showMessage("파일 확장자가 유효하지 않습니다.", "error");
                  return;
               }

               if (url && !isValidImageUrl(url)) {
                  showMessage("URL이 유효한 이미지가 아닙니다.", "error");
                  return;
               }

               if (uploadedWeather === weather) {
                  if (!confirm("이미 업로드된 사진이 있습니다. 덮어쓰시겠습니까?")) {
                     return;
                  }
               }

               const formData = new FormData();
               formData.append("weather", weather);
               if (file) formData.append("image", file);
               else formData.append("image_url", url);

               const res = await fetch("/upload-image", { method: "POST", body: formData });
               const result = await res.json();

               if (result.success) {
                  uploadedWeather = weather;
                  uploadedImageUrl = `/static/weather_images/${uploadedWeather}.png?v=${Date.now()}`;
                  showMessage("✅ 업로드가 되었습니다.", "success");
                  previewContainer.classList.add("hidden");
                  imageInput.value = "";
                  imageUrlInput.value = "";
                  fileNameSpan.textContent = "";
               }
            } catch {
               showMessage("❌ 서버 오류가 발생했습니다.", "error");
            } finally {
               isUploading = false;
               submitBtn.disabled = false;
               submitBtn.textContent = "⬆️ 업로드";
            }
         });

         resetBtn.addEventListener("click", () => {
            if (resetConfirmPending) return;
            resetConfirmPending = true;

            // 메시지 내용 설정
            uploadMessage.innerHTML = `
      <div class="mb-2">🔄 정말 모든 이미지를 기본값으로 초기화하시겠습니까?</div>
      <div class="flex justify-center gap-4 mt-2">
         <button id="confirm-reset" class="px-4 py-2 bg-red-600 text-white font-semibold rounded-lg shadow hover:bg-red-700 transition">초기화</button>
         <button id="cancel-reset" class="px-4 py-2 bg-gray-300 text-gray-800 font-semibold rounded-lg shadow hover:bg-gray-400 transition">취소</button>
      </div>
   `;

            // 메시지와 오버레이 표시
            uploadMessage.classList.remove('hidden');
            document.getElementById('modal-overlay').classList.remove('hidden');

            // 포커스 및 aria 속성 설정도 필요하면 추가

            // 이벤트 바인딩
            setTimeout(() => {
               document.getElementById("confirm-reset")?.addEventListener("click", async () => {
                  try {
                     const res = await fetch("/reset-all-images", { method: "POST" });
                     const data = await res.json();

                     if (data.success) {
                        showMessage("✅ 모든 이미지가 기본값으로 초기화되었습니다.", "success");
                        imageInput.value = "";
                        imageUrlInput.value = "";
                        weatherSelect.value = "";
                        fileNameSpan.textContent = "";
                        previewContainer.classList.add("hidden");
                        uploadedWeather = null;
                        uploadedImageUrl = null;
                     } else {
                        showMessage("⚠️ 초기화에 실패했습니다.", "warn");
                     }
                  } catch {
                     showMessage("❌ 서버 오류가 발생했습니다.", "error");
                  } finally {
                     resetConfirmPending = false;
                     uploadMessage.classList.add('hidden');
                     document.getElementById('modal-overlay').classList.add('hidden');
                  }
               });

               document.getElementById("cancel-reset")?.addEventListener("click", () => {
                  resetConfirmPending = false;
                  uploadMessage.classList.add('hidden');
                  document.getElementById('modal-overlay').classList.add('hidden');
               });
            }, 0);
         });

         goWeatherBtn.addEventListener("click", () => {
            window.location.href = "/weather";
         });
      });
   </script>

</body>

</html>
