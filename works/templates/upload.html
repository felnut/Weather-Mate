<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>날씨 이미지 업로드</title>
   <!-- 구글 웹폰트 Pretendard 불러오기 -->
   <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600&display=swap" rel="stylesheet" />
   <!-- TailwindCSS CDN -->
   <script src="https://cdn.tailwindcss.com"></script>
   <style>
      /* 본문 기본 폰트 설정 및 배경 그라데이션 적용 */
      body {
         font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
            Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
         background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      }

      /* 숨겨진 파일 입력 필드 (기본 스타일 제거) */
      input[type="file"] {
         display: none;
      }

      /* 파일 선택을 위한 라벨을 버튼처럼 꾸밈 */
      label[for="image-input"] {
         cursor: pointer;
         display: inline-block;
         padding: 0.5rem 1rem;
         background-color: #3b82f6;
         /* 파란색 배경 */
         color: white;
         border-radius: 0.375rem;
         font-weight: 600;
         box-shadow: 0 4px 6px rgb(59 130 246 / 0.4);
         transition: background-color 0.3s ease, box-shadow 0.3s ease;
         user-select: none;
         /* 텍스트 드래그 방지 */
      }

      /* 라벨 버튼 호버 시 색상 변화 */
      label[for="image-input"]:hover {
         background-color: #2563eb;
         box-shadow: 0 6px 10px rgb(37 99 235 / 0.5);
      }

      /* 미리보기 이미지에 페이드인 애니메이션 추가 */
      #preview-image {
         opacity: 0;
         transition: opacity 0.4s ease-in-out;
      }

      /* 이미지가 보일 때 opacity 1로 변경 */
      #preview-image.visible {
         opacity: 1;
      }
   </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">
   <!-- 전체 컨테이너 카드 -->
   <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-8">
      <!-- 제목 -->
      <h2 class="text-3xl font-extrabold mb-6 text-gray-900 text-center">☁️ 날씨별 이미지 업로드</h2>

      <!-- 이미지 업로드 폼 -->
      <form id="upload-form" class="space-y-6" novalidate>
         <!-- 날씨 선택 셀렉트 박스 -->
         <div>
            <label for="weather-select" class="block mb-2 text-gray-700 font-semibold">날씨 선택:</label>
            <select id="weather-select" required
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-800 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 transition">
               <option value="" disabled selected>-- 날씨를 선택하세요 --</option>
               <option value="clear">맑음 (clear)</option>
               <option value="clouds">흐림 (clouds)</option>
               <option value="rain">비 (rain)</option>
               <option value="snow">눈 (snow)</option>
               <option value="thunderstorm">천둥번개 (thunderstorm)</option>
               <option value="fog">안개 (fog)</option>
               <option value="default">기본 이미지 사용</option>
            </select>
         </div>

         <!-- 파일 입력 -->
         <div>
            <label for="image-input" class="block mb-2 text-gray-700 font-semibold cursor-pointer">이미지 선택:</label>
            <!-- 실제 파일 입력 필드는 숨김 처리 -->
            <input type="file" id="image-input" accept=".png,.jpg,.jpeg,.gif,.svg,.webp" />
            <!-- 라벨이 파일 선택 버튼 역할 -->
            <label for="image-input" aria-label="이미지 파일 선택">파일 선택하기</label>
            <!-- 선택한 파일 이름 표시 -->
            <span id="file-name" class="ml-3 text-gray-500 italic"></span>
         </div>

         <!-- URL 입력 -->
         <div>
            <label for="image-url-input" class="block mb-2 text-gray-700 font-semibold">이미지 URL 입력:</label>
            <input type="url" id="image-url-input" placeholder="https://example.com/image.png"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-800 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 transition" />
         </div>

         <!-- 버튼 그룹 -->
         <div class="flex flex-wrap gap-3 justify-between">
            <button type="button" id="preview-btn"
               class="flex-grow bg-blue-600 text-white font-semibold px-5 py-3 rounded-lg shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition">
               미리보기
            </button>
            <button type="submit"
               class="flex-grow bg-green-600 text-white font-semibold px-5 py-3 rounded-lg shadow-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-300 transition">
               업로드
            </button>
            <button type="button" id="reset-btn"
               class="flex-grow bg-red-600 text-white font-semibold px-5 py-3 rounded-lg shadow-lg hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-300 transition">
               초기화
            </button>
         </div>
      </form>

      <!-- 업로드 상태 메시지 표시 영역 -->
      <div id="upload-message" class="mt-6 text-center text-sm font-semibold hidden" role="alert" aria-live="polite">
      </div>

      <!-- 이미지 미리보기 영역 -->
      <div id="preview-container" class="mt-6 rounded-lg border border-gray-300 shadow-md overflow-hidden hidden">
         <p class="text-gray-700 mb-3 px-4 pt-4 select-text">🔍 미리보기:</p>
         <img id="preview-image" src="#" alt="미리보기 이미지" class="w-full max-h-72 object-contain" loading="lazy"
            decoding="async" />
      </div>

      <!-- 날씨 정보 페이지 이동 버튼 -->
      <div class="mt-8 text-right inline-flex items-center justify-end gap-2">
         <span class="select-none text-xl">👉</span>
         <button id="go-weather-btn"
            class="text-gray-900 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 rounded transition font-semibold">
            날씨 정보 페이지로 이동
         </button>
      </div>
   </div>

   <script>
      document.addEventListener("DOMContentLoaded", () => {
         // DOM 요소 변수 저장
         const uploadForm = document.getElementById("upload-form");
         const previewBtn = document.getElementById("preview-btn");
         const previewContainer = document.getElementById("preview-container");
         const previewImage = document.getElementById("preview-image");
         const uploadMessage = document.getElementById("upload-message");
         const weatherSelect = document.getElementById("weather-select");
         const imageInput = document.getElementById("image-input");
         const imageUrlInput = document.getElementById("image-url-input");
         const resetBtn = document.getElementById("reset-btn");
         const goWeatherBtn = document.getElementById("go-weather-btn");
         const fileNameSpan = document.getElementById("file-name");

         // 현재 업로드된 날씨와 이미지 URL 저장용 변수
         let uploadedWeather = null;
         let uploadedImageUrl = null;

         // 허용하는 이미지 파일 확장자 정규식
         const validExtensions = /\.(png|jpg|jpeg|gif|svg|webp)$/i;

         /**
          * 이미지 URL 유효성 검사 함수 (쿼리스트링 제외하고 검사)
          * @param {string} url 
          * @returns {boolean} 유효하면 true
          */
         function isValidImageUrl(url) {
            try {
               const cleanUrl = url.split("?")[0]; // 쿼리스트링 제거
               return validExtensions.test(cleanUrl);
            } catch {
               return false;
            }
         }

         /**
          * 상태 메시지 표시 함수
          * @param {string} text - 메시지 내용
          * @param {'info'|'success'|'error'|'warn'} type - 메시지 종류
          */
         function showMessage(text, type = 'info') {
            uploadMessage.textContent = text;
            uploadMessage.className = 'mt-6 text-center text-sm font-semibold';
            uploadMessage.classList.remove('hidden');
            uploadMessage.setAttribute('role', 'alert');
            uploadMessage.setAttribute('aria-live', 'polite');

            // 메시지 색상 클래스 적용
            uploadMessage.classList.add({
               success: 'text-green-600',
               error: 'text-red-600',
               warn: 'text-yellow-600',
               info: 'text-gray-800'
            }[type] || 'text-gray-800');
         }

         /**
          * 메시지 영역 초기화 함수
          */
         function clearMessage() {
            uploadMessage.textContent = '';
            uploadMessage.classList.add('hidden');
            uploadMessage.removeAttribute('role');
            uploadMessage.removeAttribute('aria-live');
         }

         /**
          * 파일 이름 확장자 유효성 검사
          * @param {string} filename 
          * @returns {boolean}
          */
         function isValidFileExtension(filename) {
            return validExtensions.test(filename);
         }

         // 날씨 선택 변경 이벤트 처리
         weatherSelect.addEventListener("change", () => {
            clearMessage();
            previewContainer.classList.add("hidden");
            imageInput.value = "";
            imageUrlInput.value = "";
            fileNameSpan.textContent = "";

            const selected = weatherSelect.value;

            if (!selected) {
               uploadedWeather = null;
               uploadedImageUrl = null;
               return;
            }

            // 기본 이미지 선택 시 메시지 표시 후 변수 초기화
            if (selected === "default") {
               uploadedWeather = null;
               uploadedImageUrl = null;
               showMessage("기본 이미지 사용을 선택했습니다.", "warn");
               return;
            }

            // 이미 업로드된 날씨 이미지가 있으면 알려줌
            if (uploadedWeather === selected && uploadedImageUrl) {
               showMessage("✅ 이미 업로드 하셨습니다.", "success");
            }
         });

         // 파일 입력 변경 시 파일명 표시 및 URL 입력 초기화
         imageInput.addEventListener("change", () => {
            if (imageInput.files.length > 0) {
               fileNameSpan.textContent = imageInput.files[0].name;
               imageUrlInput.value = "";
               clearMessage();
               previewContainer.classList.add("hidden");
            } else {
               fileNameSpan.textContent = "";
            }
         });

         // 미리보기 버튼 클릭 이벤트
         previewBtn.addEventListener("click", () => {
            const file = imageInput.files[0];
            const url = imageUrlInput.value.trim();

            // 파일이 선택된 경우
            if (file) {
               if (!isValidFileExtension(file.name)) {
                  alert("사진에 오류가 있습니다. 가능한 확장자는 png, jpg, jpeg, gif, svg, webp 입니다.");
                  return;
               }
               const reader = new FileReader();
               reader.onload = e => {
                  previewImage.src = e.target.result;
                  previewImage.classList.add("visible"); // 페이드인 효과 활성화
                  previewContainer.classList.remove("hidden");
               };
               reader.readAsDataURL(file);
               return;
            }

            // URL이 입력된 경우
            if (url) {
               if (!isValidImageUrl(url)) {
                  alert("지원되는 이미지 URL이 아닙니다.");
                  return;
               }
               previewImage.src = url;
               previewImage.classList.add("visible");
               previewContainer.classList.remove("hidden");
               return;
            }

            // 이미 업로드된 이미지가 있으면 캐시 방지용 타임스탬프 붙여서 미리보기
            if (uploadedImageUrl) {
               previewImage.src = uploadedImageUrl;
               previewImage.classList.add("visible");
               previewContainer.classList.remove("hidden");
               return;
            }

            alert("미리볼 이미지가 없습니다.");
         });

         // 폼 제출 이벤트 - 이미지 업로드 처리
         uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const weather = weatherSelect.value?.trim();
            const file = imageInput.files[0];
            const url = imageUrlInput.value.trim();

            if (!weather) {
               alert("항목을 선택해주세요.");
               return;
            }

            if (weather !== "default" && !file && !url) {
               alert("이미지 파일 또는 URL을 입력해 주세요.");
               return;
            }

            if (file && !isValidFileExtension(file.name)) {
               alert("사진에 오류가 있습니다. 가능한 확장자는 png, jpg, jpeg, gif, svg, webp 입니다.");
               return;
            }

            if (url && !isValidImageUrl(url)) {
               alert("지원되는 이미지 URL이 아닙니다.");
               return;
            }

            // 이미 업로드된 이미지가 있으면 덮어쓰기 확인
            if (weather !== "default" && uploadedWeather === weather) {
               if (!confirm("이미 업로드된 사진이 있습니다. 덮어쓰시겠습니까?")) {
                  return;
               }
            }

            // FormData에 날씨와 이미지 데이터 담기
            const formData = new FormData();
            formData.append("weather", weather);
            if (file) formData.append("image", file);
            else if (url) formData.append("image_url", url);

            try {
               // 서버로 업로드 요청
               const res = await fetch("/upload-image", { method: "POST", body: formData });
               if (!res.ok) throw new Error(`서버 응답 오류: ${res.status}`);

               const result = await res.json();

               if (result.success) {
                  // 업로드 성공 처리: 상태 변수 업데이트 및 메시지 표시
                  uploadedWeather = weather === "default" ? null : weather;
                  if (uploadedWeather) {
                     // 캐시 방지를 위해 쿼리스트링에 타임스탬프 추가
                     uploadedImageUrl = `/static/weather_images/${uploadedWeather}.png?v=${Date.now()}`;
                  } else {
                     uploadedImageUrl = null;
                  }

                  showMessage("✅ 업로드가 되었습니다.", "success");
                  previewContainer.classList.add("hidden");
                  imageInput.value = "";
                  imageUrlInput.value = "";
                  fileNameSpan.textContent = "";
               }
            } catch {
               showMessage("❌ 서버 오류가 발생했습니다.", "error");
            }
         });

         // 초기화 버튼 클릭 이벤트 - 서버에 초기화 요청 및 UI 초기화
         resetBtn.addEventListener("click", async () => {
            if (!confirm("모든 업로드된 이미지를 초기화 하시겠습니까?")) return;

            try {
               const res = await fetch("/reset-images", { method: "POST" });
               if (!res.ok) throw new Error(`서버 응답 오류: ${res.status}`);

               const result = await res.json();

               if (result.success) {
                  uploadedWeather = null;
                  uploadedImageUrl = null;
                  showMessage("✅ 모든 이미지가 초기화 되었습니다.", "success");
                  previewContainer.classList.add("hidden");
                  weatherSelect.value = "";
                  imageInput.value = "";
                  imageUrlInput.value = "";
                  fileNameSpan.textContent = "";
                  previewImage.src = "";
                  previewImage.classList.remove("visible");
               } else {
                  showMessage("❌ 초기화를 실패하였습니다.", "error");
               }
            } catch {
               showMessage("❌ 서버 오류가 발생했습니다.", "error");
            }
         });

         // 날씨 정보 페이지로 이동 버튼 클릭 이벤트
         goWeatherBtn.addEventListener("click", () => {
            window.location.href = "/";
         });
      });
   </script>
</body>

</html>
